# ==========================================
# Application
# ==========================================
spring.application.name=myserver
server.port=${SERVER_PORT:8086}

# ==========================================
# Database (PostgreSQL)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / Hibernate
# ==========================================
# Flyway owns the database schema.
# Hibernate must not create or modify tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Flyway
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ==========================================
# PayMongo
# ==========================================
paymongo.secret-key=${PAYMONGO_SECRET_KEY}
paymongo.webhook-secret=${PAYMONGO_WEBHOOK_SECRET}
paymongo.live-mode=${PAYMONGO_LIVE_MODE:false}
paymongo.api-url=${PAYMONGO_API_URL}

# ==========================================
# Frontend
# ==========================================
frontend.url=${FRONT_END_URL:http://localhost:3000}

# ==========================================
# Email / Gmail SMTP
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${EMAIL_USER}
spring.mail.password=${EMAIL_PASS}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true

# SMTP timeouts
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==========================================
# JWT
# ==========================================
jwt.secret=${JWT_SECRET}

# ==========================================
# ElevenLabs TTS
# ==========================================
elevenlabs.api-key=${ELEVENLABS_API_KEY}
elevenlabs.voice-id=${ELEVENLABS_VOICE_ID}
elevenlabs.model-id=${ELEVENLABS_MODEL_ID}
elevenlabs.api-url=${ELEVENLABS_API_URL}

# ==========================================
# Semaphore SMS
# ==========================================
semaphore.api-key=${SEMAPHORE_API_KEY}
semaphore.api-url=${SEMAPHORE_API_URL}
semaphore.sender-name=${SEMAPHORE_SENDER_NAME}

# ==========================================
# Cohere (RAG)
# ==========================================
cohere.api-key=${COHERE_API_KEY}
cohere.api-url=https://api.cohere.com
cohere.embed-model=embed-v4.0
cohere.chat-model=command-a-plus-05-2026

app.audio.storage-path=${AUDIO_STORAGE_PATH}
app.audio.public-base-url=${AUDIO_PUBLIC_BASE_URL}
app.api-key=${APP_API_KEY}